<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grade Garden – Score Checker</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="backdrop"></div>

  <main class="card">
    <div class="icon"><i class="bi bi-star-fill"></i></div>
    <h1>Score Checker</h1>
    <p class="lead">Enter your name and score, and see how you did.</p>
    <button id="startBtn" class="btn">Check my score</button>

    <section id="result" class="result">
      <p id="resultName" class="result-name"></p>
      <p id="resultScore" class="result-score"></p>
      <p id="resultRemark" class="remark"></p>
      <p id="resultNote" class="note"></p>
    </section>
  </main>

  <script src="script.js"></script>
  
</body>
</html>
